name: "External RDP Compromise and ADCS/NTDS Dump"
description: "Симуляция взлома внешней RDP-сессии директора, дамп учетных данных из LSASS и последующая атака на контроллер домена с выгрузкой NTDS.dit."
global_context:
  host.name: "PC-DIRECTOR"
  host.domain: "{env.domain}"
  user.name: "director"

steps:
  - id: "step_1_external_rdp_access"
    template: "win_security_4624"
    description: "Успешный вход по RDP из внешней сети на компьютер директора (например, из-за утечки пароля или брутфорса)."
    delay_from_prev: "0s"
    fields:
      host_name: "PC-DIRECTOR"
      host_ip: "192.168.100.24"
      source_ip: "203.0.113.45"
      destination_ip: "192.168.100.24"
      user_name: "director"
      logon_type: 10
      logon_process_name: "User32"
      mitre_technique: "T1133"
      mitre_technique_name: "External Remote Services"

  - id: "step_2_credential_dump_lsass"
    template: "win_sysmon_1_process_creation"
    description: "Атакующий запускает procdump для создания дампа процесса LSASS в обход антивируса."
    delay_from_prev: "5m"
    depends_on: "step_1_external_rdp_access"
    fields:
      host_name: "PC-DIRECTOR"
      host_ip: "192.168.100.24"
      user_name: "SYSTEM"
      parent_name: "cmd.exe"
      parent_path: @"C:\Windows\System32\cmd.exe"
      process_name: "procdump.exe"
      process_path: @"C:\Users\Public\Downloads\procdump.exe"
      process_command_line: @"procdump.exe -accepteula -ma lsass.exe C:\Users\Public\Downloads\lsass.dmp"
      mitre_technique: "T1003.001"
      mitre_technique_name: "OS Credential Dumping: LSASS Memory"

  - id: "step_3_lateral_movement_ad02"
    template: "win_security_4624"
    description: "Атакующий использует полученные NTLM-хэши администратора для бокового перемещения (Pass-the-Hash) на контроллер домена AD02."
    delay_from_prev: "10m"
    depends_on: "step_2_credential_dump_lsass"
    fields:
      host_name: "AD02"
      host_ip: "192.168.100.2"
      source_ip: "192.168.100.24"
      destination_ip: "192.168.100.2"
      user_name: "admin"
      logon_type: 3
      logon_process_name: "NtLmSsp"
      mitre_technique: "T1550.002"
      mitre_technique_name: "Use Alternate Authentication Material: Pass the Hash"

  - id: "step_4_domain_dominance_ntds"
    template: "win_sysmon_1_process_creation"
    description: "Создание теневой копии и дамп базы Active Directory (NTDS.dit) для получения хэшей всех пользователей домена."
    delay_from_prev: "1m"
    depends_on: "step_3_lateral_movement_ad02"
    fields:
      host_name: "AD02"
      host_ip: "192.168.100.2"
      user_name: "SYSTEM"
      parent_name: "cmd.exe"
      parent_path: @"C:\Windows\System32\cmd.exe"
      process_name: "ntdsutil.exe"
      process_path: @"C:\Windows\System32\ntdsutil.exe"
      process_command_line: @"ntdsutil.exe ""ac i ntds"" ""ifm"" ""create full C:\Windows\Temp\ntds_dump"" q q"
      mitre_technique: "T1003.003"
      mitre_technique_name: "OS Credential Dumping: NTDS"
