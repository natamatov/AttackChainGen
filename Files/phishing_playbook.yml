name: "Phishing Attack with Lateral Movement"
description: "Симуляция фишинговой атаки: доставка вредоносного вложения через почту, выполнение payload, установление соединения с C2 и последующее латеральное перемещение на контроллер домена."
global_context:
  host.name: "PC1"
  host.domain: "{env.domain}"
  user.name: "jdoe"

steps:
  - id: "step_1_payload_delivery"
    template: "sysmon_event_11"
    description: "Доставка вредоносного файла (invoice_2026.doc.exe) на машину жертвы PC1 в папку Downloads."
    delay_from_prev: "0s"
    fields:
      host_name: "PC1"
      host_ip: "192.168.100.20"
      user_name: "jdoe"
      file_name: "invoice_2026.doc.exe"
      file_path: "C:\\Users\\jdoe\\Downloads\\invoice_2026.doc.exe"
      mitre_technique: "T1566.001"
      mitre_tactic: "Initial Access"

  - id: "step_2_payload_execution"
    template: "win_security_4688"
    description: "Выполнение скачанного вредоносного файла пользователем (почтовым клиентом)."
    delay_from_prev: "30s"
    depends_on: "step_1_payload_delivery"
    fields:
      host_name: "PC1"
      host_ip: "192.168.100.20"
      user_name: "jdoe"
      process_name: "invoice_2026.doc.exe"
      process_path: "C:\\Users\\jdoe\\Downloads\\invoice_2026.doc.exe"
      parent_name: "outlook.exe"
      parent_path: "C:\\Program Files\\Microsoft Office\\root\\Office16\\outlook.exe"
      process_command_line: "invoice_2026.doc.exe -silent"
      mitre_technique: "T1204.002"
      mitre_tactic: "Execution"

  - id: "step_3_c2_connection"
    template: "sysmon_event_3"
    description: "Вредоносный процесс устанавливает сетевое соединение с C2-сервером."
    delay_from_prev: "10s"
    depends_on: "step_2_payload_execution"
    fields:
      host_name: "PC1"
      host_ip: "192.168.100.20"
      user_name: "jdoe"
      process_name: "invoice_2026.doc.exe"
      process_path: "C:\\Users\\jdoe\\Downloads\\invoice_2026.doc.exe"
      source_ip: "192.168.100.20"
      source_port: 49201
      destination_ip: "192.168.100.254"
      destination_port: 443
      network_protocol: "tcp"
      mitre_technique: "T1071.001"
      mitre_tactic: "Command and Control"

  - id: "step_4_recon_whoami"
    template: "sysmon_event_1"
    description: "Сбор информации о текущем пользователе и привилегиях."
    delay_from_prev: "2m"
    depends_on: "step_3_c2_connection"
    fields:
      host_name: "PC1"
      host_ip: "192.168.100.20"
      user_name: "jdoe"
      process_name: "whoami.exe"
      process_path: "C:\\Windows\\System32\\whoami.exe"
      parent_name: "invoice_2026.doc.exe"
      parent_path: "C:\\Users\\jdoe\\Downloads\\invoice_2026.doc.exe"
      process_command_line: "whoami /all"
      mitre_technique: "T1033"
      mitre_tactic: "Discovery"

  - id: "step_5_lateral_movement_ad"
    template: "win_security_4624"
    description: "Успешный вход на контроллер домена AD02 по сети (Pass-the-Hash / украденные учетные данные)."
    delay_from_prev: "10m"
    depends_on: "step_4_recon_whoami"
    fields:
      host_name: "AD02"
      host_ip: "192.168.100.2"
      user_name: "administrator"
      source_ip: "192.168.100.20"
      destination_ip: "192.168.100.2"
      logon_type: 3
      logon_process_name: "NtLmSsp"
      mitre_technique: "T1078.002"
      mitre_tactic: "Lateral Movement"

  - id: "step_6_remote_execution_ad"
    template: "win_security_4688"
    description: "Удаленное выполнение команд на контроллере домена AD02."
    delay_from_prev: "5s"
    depends_on: "step_5_lateral_movement_ad"
    fields:
      host_name: "AD02"
      host_ip: "192.168.100.2"
      user_name: "administrator"
      process_name: "cmd.exe"
      process_path: "C:\\Windows\\System32\\cmd.exe"
      parent_name: "wmiprvse.exe"
      parent_path: "C:\\Windows\\System32\\wbem\\WmiPrvSe.exe"
      process_command_line: "cmd.exe /c ntdsutil.exe \"ac i ntds\" \"ifm\" \"create full c:\\temp\" q q"
      mitre_technique: "T1047"
      mitre_tactic: "Execution"
