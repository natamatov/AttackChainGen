name: "Vector 1: AI-Enhanced Phishing & InfoStealer"
description: "Симуляция фишинговой атаки на ПК бухгалтера с использованием ИИ-сгенерированного письма. Жертва скачивает стилер, который закрепляется в системе и связывается с C2-сервером."
global_context:
  host.name: "PC-Accountant"
  host.domain: "corp.local.uz"
  user.name: "accountant"
steps:
  - id: "v1_step1_phishing_exec"
    template: "win_security_4688"
    description: "Запуск вредоносного вложения (setup.exe) из почтового клиента."
    delay_from_prev: "0s"
    fields:
      host_name: "PC-Accountant"
      host_ip: "192.168.100.23"
      user_name: "accountant"
      user_domain: "corp.local.uz"
      process_name: "C:\\Users\\accountant\\Downloads\\setup.exe"
      parent_path: "C:\\Program Files\\Microsoft Office\\root\\Office16\\OUTLOOK.EXE"
      process_command_line: "setup.exe /silent"
      mitre_technique: "T1566.001"

  - id: "v1_step2_file_drop"
    template: "sysmon_event_11"
    description: "Стилер сохраняет свой рабочий модуль (payload.dll) в папку AppData."
    delay_from_prev: "10s"
    depends_on: "v1_step1_phishing_exec"
    fields:
      host_name: "PC-Accountant"
      host_ip: "192.168.100.23"
      user_name: "accountant"
      process_name: "C:\\Users\\accountant\\Downloads\\setup.exe"
      file_path: "C:\\Users\\accountant\\AppData\\Roaming\\payload.dll"
      mitre_technique: "T1059"

  - id: "v1_step3_c2_connection"
    template: "sysmon_event_3"
    description: "Стилер устанавливает сетевое соединение с внешним C2 сервером Telegram API для эксфильтрации данных."
    delay_from_prev: "1m"
    depends_on: "v1_step2_file_drop"
    fields:
      host_name: "PC-Accountant"
      host_ip: "192.168.100.23"
      user_name: "accountant"
      process_name: "C:\\Users\\accountant\\Downloads\\setup.exe"
      source_ip: "192.168.100.23"
      destination_ip: "149.154.167.220"
      destination_port: 443
      protocol: "tcp"
      mitre_technique: "T1071.001"
