name: "Linux Vector 3: Docker Escape & Ransomware"
description: "Атака на DevOps-инфраструктуру. Злоумышленник получает доступ к уязвимому Docker-контейнеру (или API Daemon), запускает привилегированный контейнер с доступом к файловой системе хоста и выходит из него (Escape to Host), чтобы запустить Linux-версию программы-вымогателя."
global_context:
  host.name: "SERVER-1C"
  host.domain: "corp.local.uz"
  user.name: "root"
steps:
  - id: "l_v3_step1_privileged_container"
    template: "linux_auditd_execve"
    description: "Запуск контейнера с флагом --privileged и монтированием корневой файловой системы сервера-хоста."
    delay_from_prev: "0s"
    fields:
      host_name: "SERVER-1C"
      host_ip: "192.168.100.7"
      user_name: "root"
      process_name: "/usr/bin/docker"
      parent_path: "/usr/bin/bash"
      process_command_line: "docker run -v /:/mnt --privileged -it alpine chroot /mnt"
      mitre_technique: "T1611"

  - id: "l_v3_step2_cron_backdoor"
    template: "sysmon_event_11"
    description: "Создание вредоносной cron-задачи прямо в примонтированной файловой системе хоста (Escape)."
    delay_from_prev: "2m"
    depends_on: "l_v3_step1_privileged_container"
    fields:
      host_name: "SERVER-1C"
      host_ip: "192.168.100.7"
      user_name: "root"
      process_name: "/bin/sh"
      file_path: "/etc/cron.d/reverse_shell"
      mitre_technique: "T1053.003"

  - id: "l_v3_step3_ransomware_exec"
    template: "linux_auditd_execve"
    description: "Выполнение вредоносного ELF-файла (Linux Ransomware) на уровне хоста через backdoor."
    delay_from_prev: "5m"
    depends_on: "l_v3_step2_cron_backdoor"
    fields:
      host_name: "SERVER-1C"
      host_ip: "192.168.100.7"
      user_name: "root"
      process_name: "/tmp/encryptor.elf"
      parent_path: "/usr/sbin/cron"
      process_command_line: "/tmp/encryptor.elf --dir /var/lib/docker/volumes"
      mitre_technique: "T1486"
