name: "Linux Vector 1: SSH Brute-Force and Key Theft"
description: "Атакующий использует перебор паролей по SSH для доступа к почтовому серверу (mail01). После успешного входа он сканирует внутреннюю сеть для поиска других уязвимых хостов."
global_context:
  host.name: "mail01"
  host.domain: "corp.local.uz"
  user.name: "admin"
steps:
  - id: "l_v1_step1_ssh_bruteforce"
    template: "linux_syslog_auth"
    description: "Множественные неудачные попытки аутентификации по SSH (брутфорс)."
    delay_from_prev: "0s"
    fields:
      host_name: "mail01"
      host_ip: "192.168.100.5"
      source_ip: "203.0.113.15"
      user_name: "admin"
      auth_method: "password"
      status: "Failed"
      mitre_technique: "T1110.001"

  - id: "l_v1_step2_ssh_success"
    template: "linux_syslog_auth"
    description: "Успешный вход по SSH после перебора паролей."
    delay_from_prev: "2m"
    depends_on: "l_v1_step1_ssh_bruteforce"
    fields:
      host_name: "mail01"
      host_ip: "192.168.100.5"
      source_ip: "203.0.113.15"
      user_name: "admin"
      auth_method: "password"
      status: "Accepted"
      mitre_technique: "T1078.003"

  - id: "l_v1_step3_internal_recon"
    template: "linux_auditd_execve"
    description: "Запуск nmap для сканирования внутренней сети серверов со взломанного почтового сервера."
    delay_from_prev: "5m"
    depends_on: "l_v1_step2_ssh_success"
    fields:
      host_name: "mail01"
      host_ip: "192.168.100.5"
      user_name: "admin"
      process_name: "/usr/bin/nmap"
      process_command_line: "nmap -sS -p 22 192.168.100.0/24"
      mitre_technique: "T1046"
