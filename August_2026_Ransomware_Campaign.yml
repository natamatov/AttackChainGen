name: "August 2026 Campaign: AI Spearphishing to FS01 Ransomware"
description: "Симуляция трендовой атаки августа 2026 года (Ransomware-as-a-Service с использованием LLM для фишинга). Атака начинается с идеального фишингового письма для менеджера по продажам, закрепляется безфайловым способом, находит файловый сервер и шифрует данные."
global_context:
  host.name: "PC-SELLER"
  host.domain: "{env.domain}"
  user.name: "seller"

steps:
  - id: "step_1_initial_access_phishing"
    template: "win_sysmon_1_process_creation"
    description: "Менеджер открывает вредоносный PDF (AI-generated invoice), который через уязвимость Reader'а запускает PowerShell с base64-обфусцированной командой (Fileless malware)."
    delay_from_prev: "0s"
    fields:
      host_name: "PC-SELLER"
      host_ip: "192.168.100.26"
      user_name: "seller"
      parent_name: "AcroRd32.exe"
      parent_path: @"C:\Program Files (x86)\Adobe\Acrobat Reader DC\Reader\AcroRd32.exe"
      process_name: "powershell.exe"
      process_path: @"C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe"
      process_command_line: @"powershell.exe -nop -w hidden -EncodedCommand JABzAD0ATgBlAHcALQBPAGIAagBlAGMAdAAgAEkATwAuAE0AZQBtAG8AcgB5AFMAdAByAGUAYQBtACgAWwBDAG8AbgB2AGUAcgB0AF0AOgA6AEYAcgBvAG0AQgBhAHMAZQA2ADQAUwB0AHIAaQBuAGcAKAAiAEgA..."
      mitre_technique: "T1566.001"
      mitre_technique_name: "Spearphishing Attachment"

  - id: "step_2_recon_network"
    template: "sysmon_event_3"
    description: "Вредоносный скрипт сканирует подсеть серверов (порт 445 SMB), ища файловые шары для шифрования."
    delay_from_prev: "2m"
    depends_on: "step_1_initial_access_phishing"
    fields:
      host_name: "PC-SELLER"
      host_ip: "192.168.100.26"
      user_name: "SYSTEM"
      process_name: "powershell.exe"
      process_path: @"C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe"
      source_ip: "192.168.100.26"
      source_port: 49152
      destination_ip: "192.168.100.1"
      destination_port: 445
      network_protocol: "tcp"
      mitre_technique: "T1046"
      mitre_technique_name: "Network Service Discovery"

  - id: "step_3_lateral_movement_smb"
    template: "win_security_4624"
    description: "Вредонос успешно подключается к файловому серверу FS01 используя украденный токен."
    delay_from_prev: "1m"
    depends_on: "step_2_recon_network"
    fields:
      host_name: "FS01"
      host_ip: "192.168.100.1"
      source_ip: "192.168.100.26"
      destination_ip: "192.168.100.1"
      user_name: "seller"
      logon_type: 3
      logon_process_name: "NtLmSsp"
      mitre_technique: "T1021.002"
      mitre_technique_name: "SMB/Windows Admin Shares"

  - id: "step_4_inhibit_recovery"
    template: "win_sysmon_1_process_creation"
    description: "Удаленное выполнение команды на FS01 для удаления теневых копий томов перед шифрованием (защита от восстановления)."
    delay_from_prev: "15s"
    depends_on: "step_3_lateral_movement_smb"
    fields:
      host_name: "FS01"
      host_ip: "192.168.100.1"
      user_name: "SYSTEM"
      parent_name: "WmiPrvSE.exe"
      parent_path: @"C:\Windows\System32\wbem\WmiPrvSE.exe"
      process_name: "vssadmin.exe"
      process_path: @"C:\Windows\System32\vssadmin.exe"
      process_command_line: @"vssadmin.exe Delete Shadows /All /Quiet"
      mitre_technique: "T1490"
      mitre_technique_name: "Inhibit System Recovery"

  - id: "step_5_impact_encryption"
    template: "sysmon_event_11"
    description: "Шифровальщик начинает массово создавать зашифрованные файлы с расширением .locked2026 на диске сервера."
    delay_from_prev: "5s"
    depends_on: "step_4_inhibit_recovery"
    fields:
      host_name: "FS01"
      host_ip: "192.168.100.1"
      user_name: "SYSTEM"
      process_name: "WmiPrvSE.exe"
      process_path: @"C:\Windows\System32\wbem\WmiPrvSE.exe"
      file_name: "Finance_Q3.xlsx.locked2026"
      mitre_technique: "T1486"
      mitre_technique_name: "Data Encrypted for Impact"
