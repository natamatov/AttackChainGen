id: "step_5_lateral_movement_to_dc"
template: "win_security_4624"
description: "Боковое перемещение (Lateral Movement): После получения валидных доменных учетных данных атакующий осуществляет успешный сетевой вход (Logon Type 3) по протоколу SMB/RPC на контроллер домена AD02."
