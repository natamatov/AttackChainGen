description: "Выполнения и закрепление (Execution & Persistence): На контроллере домена AD02 через Service Control Manager (services.exe) создается и запускается удаленная служба, которая инициирует командную строку с привилегиями SYSTEM."
delay_from_prev: "1m"
depends_on: "step_5_lateral_movement_to_dc"
